plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}
dependencies {
    implementation("dev.turtywurty.turtymultiloader:turtymultiloader-fabric:${turtymultiloader_version}")
    include("dev.turtywurty.turtymultiloader:turtymultiloader-fabric:${turtymultiloader_version}")
    minecraft("com.mojang:minecraft:${minecraft_version}")
    implementation("net.fabricmc:fabric-loader:${fabric_loader_version}")
    implementation("net.fabricmc.fabric-api:fabric-api:${fabric_version}")
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.classtweaker")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        dataGeneration {
            client()
            runDir('runs/datagen')
            property('fabric-api.datagen', 'true')
            property('fabric-api.datagen.modid', mod_id)
            property('fabric-api.datagen.output-dir', project(':common').file('src/generated/resources').absolutePath)
        }
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
[
    'apiElements',
    'runtimeElements',
    'sourcesElements',
    'javadocElements',
    'includeInternal',
    'modCompileClasspath'
].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [
        it.compileClasspathConfigurationName,
        it.runtimeClasspathConfigurationName
    ].each { variant ->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}
