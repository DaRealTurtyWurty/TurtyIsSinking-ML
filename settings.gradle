pluginManagement {
    repositories {
        maven {
            name = 'Railroad'
            url = uri('https://maven.railroadide.dev/releases')
            content { includeGroupAndSubgroups('dev.railroadide') }
        }
        gradlePluginPortal()
        mavenCentral()
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Fabric'
                    url = uri('https://maven.fabricmc.net')
                }
            }
            filter {
                includeGroupAndSubgroups('net.fabricmc')
            }
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'TurtyIsSinking-ML'
includeBuild('build-logic')
include('common')
include('fabric')
include('neoforge')
